<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Budget - spreadsheet</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      /* D206: the parts of Google Sheets a cell step relies on, with its element ids and classes. */
      body { margin: 0; }
      .sheet-head h1 { font-size: 18px; margin: 8px; }
      .toolbar { min-height: 40px; }
      .bar { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #ccc; }
      .waffle-name-box { width: 80px; }
      #waffle-grid-container { position: relative; height: 420px; overflow: hidden; }
      #waffle-grid-container canvas { display: block; }
      .active-cell-border { position: absolute; border: 2px solid #1a73e8; box-sizing: border-box; pointer-events: none; }
      #waffle-rich-text-editor { position: absolute; min-width: 80px; height: 20px; outline: none; font: 12px sans-serif; background: transparent; }
      #filter-menu { position: absolute; background: #fff; border: 1px solid #999; padding: 4px; width: 140px; }
      #filter-menu [role='menuitemcheckbox'] { padding: 4px; cursor: pointer; }
      #filter-menu [aria-checked='true']::before { content: '✓ '; }
      .tabs { display: flex; gap: 4px; padding: 4px 8px; border-top: 1px solid #ccc; }
      .docs-sheet-tab { padding: 4px 10px; border: 1px solid #ccc; cursor: pointer; }
      .docs-sheet-active-tab { background: #e8f0fe; font-weight: 600; }
    </style>
  </head>
  <body>
    <!-- As in Sheets, the title, the menus and the toolbar sit above the Name Box. -->
    <header class="sheet-head">
      <h1>Budget</h1>
      <div class="bar" role="menubar" aria-label="Menus">
        <span role="menuitem">File</span><span role="menuitem">Edit</span><span role="menuitem">View</span><span role="menuitem">Data</span>
      </div>
      <div class="bar toolbar" role="toolbar" aria-label="Main toolbar">
        <button type="button" id="undo">Undo</button><button type="button" id="bold">Bold</button>
      </div>
    </header>
    <div class="bar" role="banner" aria-label="Menu bar">
      <div class="waffle-name-box-container" aria-label="Name box (Ctrl + J)">
        <input class="jfk-textinput waffle-name-box" id="t-name-box" type="text" spellcheck="false" autocomplete="off" value="A1" />
      </div>
      <button type="button" id="sort-asc">Sort A to Z</button>
      <span id="last-action"></span>
    </div>
    <div id="waffle-grid-container">
      <div class="grid4-inner-container"><canvas id="grid" width="760" height="420"></canvas></div>
      <!-- #115: as in Sheets, typing goes into a cell editor named after the selected cell. -->
      <div id="waffle-rich-text-editor" class="cell-input" contenteditable="true" role="combobox" aria-label="A1" spellcheck="false"></div>
      <!-- D208: as in Sheets, the selected cell's border is an element; no other cell has one. -->
      <div class="range-border active-cell-border" id="fx-active-border"></div>
    </div>
    <!-- #115: the filter button is drawn in column C's header; its menu is an ordinary element. -->
    <div id="filter-menu" role="menu" aria-label="Filter" style="display: none">
      <div role="menuitemcheckbox" aria-checked="true" tabindex="-1" data-value="done">Done</div>
      <div role="menuitemcheckbox" aria-checked="true" tabindex="-1" data-value="open">Open</div>
    </div>
    <div class="tabs">
      <div class="docs-sheet-tab docs-sheet-active-tab" role="button" tabindex="0"><span class="docs-sheet-tab-name">Budget</span></div>
      <div class="docs-sheet-tab" role="button" tabindex="0"><span class="docs-sheet-tab-name">Totals</span></div>
    </div>
    <script type="module">
      // A canvas grid: column headers A..H, row headers 1..16. Selection moves on mousedown, as in Sheets.
      const W = 90, H = 24, HEAD_W = 40, HEAD_H = 24, COLS = 8, ROWS = 16;
      const canvas = document.getElementById('grid');
      const box = document.getElementById('t-name-box');
      const ctx = canvas.getContext('2d');
      const col = (c) => String.fromCharCode(65 + c);
      let sel = { c0: 0, r0: 0, c1: 0, r1: 0 };
      const refOf = (s) => {
        const a = `${col(s.c0)}${s.r0 + 1}`;
        const b = `${col(s.c1)}${s.r1 + 1}`;
        return a === b ? a : `${a}:${b}`;
      };
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = '12px sans-serif';
        ctx.strokeStyle = '#ddd';
        for (let c = 0; c < COLS; c++) ctx.fillText(col(c), HEAD_W + c * W + W / 2 - 4, 16);
        for (let r = 0; r < ROWS; r++) ctx.fillText(String(r + 1), 12, HEAD_H + r * H + 16);
        for (let c = 0; c <= COLS; c++) ctx.strokeRect(HEAD_W + c * W, 0, 0, HEAD_H + ROWS * H);
        for (let r = 0; r <= ROWS; r++) ctx.strokeRect(0, HEAD_H + r * H, HEAD_W + COLS * W, 0);
        const [c0, c1] = [Math.min(sel.c0, sel.c1), Math.max(sel.c0, sel.c1)];
        const [r0, r1] = [Math.min(sel.r0, sel.r1), Math.max(sel.r0, sel.r1)];
        ctx.strokeStyle = '#1a73e8';
        ctx.lineWidth = 2;
        ctx.strokeRect(HEAD_W + c0 * W, HEAD_H + r0 * H, (c1 - c0 + 1) * W, (r1 - r0 + 1) * H);
        ctx.lineWidth = 1;
      }
      const editor = document.getElementById('waffle-rich-text-editor');
      const values = new Map();
      function placeEditor() {
        const r = canvas.getBoundingClientRect();
        const g = canvas.parentElement.parentElement.getBoundingClientRect();
        Object.assign(editor.style, { left: `${r.left - g.left + HEAD_W + sel.c0 * W + 4}px`, top: `${r.top - g.top + HEAD_H + sel.r0 * H + 2}px` });
        editor.setAttribute('aria-label', `${col(sel.c0)}${sel.r0 + 1}`);
        const [c0, c1] = [Math.min(sel.c0, sel.c1), Math.max(sel.c0, sel.c1)];
        const [r0, r1] = [Math.min(sel.r0, sel.r1), Math.max(sel.r0, sel.r1)];
        Object.assign(document.getElementById('fx-active-border').style, {
          left: `${r.left - g.left + HEAD_W + c0 * W}px`,
          top: `${r.top - g.top + HEAD_H + r0 * H}px`,
          width: `${(c1 - c0 + 1) * W}px`,
          height: `${(r1 - r0 + 1) * H}px`,
        });
      }
      function select(s) {
        sel = s;
        box.value = refOf({ c0: Math.min(s.c0, s.c1), r0: Math.min(s.r0, s.r1), c1: Math.max(s.c0, s.c1), r1: Math.max(s.r0, s.r1) });
        placeEditor();
        draw();
      }
      const cellAt = (e) => {
        const r = canvas.getBoundingClientRect();
        const c = Math.floor((e.clientX - r.left - HEAD_W) / W);
        const row = Math.floor((e.clientY - r.top - HEAD_H) / H);
        return c >= 0 && c < COLS && row >= 0 && row < ROWS ? { c, r: row } : null;
      };
      let dragging = false;
      const menu = document.getElementById('filter-menu');
      canvas.addEventListener('mousedown', (e) => {
        const r = canvas.getBoundingClientRect();
        const x = e.clientX - r.left;
        const y = e.clientY - r.top;
        // The filter button: column C's header. It opens the filter menu below it; the selection stays.
        if (y < HEAD_H && x > HEAD_W + 2 * W && x < HEAD_W + 3 * W) {
          Object.assign(menu.style, { left: `${r.left + HEAD_W + 2 * W}px`, top: `${r.top + HEAD_H + scrollY}px` });
          menu.style.display = 'block';
          return;
        }
        menu.style.display = 'none';
        const at = cellAt(e);
        if (!at) return;
        dragging = true;
        select({ c0: at.c, r0: at.r, c1: at.c, r1: at.r });
      });
      canvas.addEventListener('mousemove', (e) => {
        const at = dragging && cellAt(e);
        if (at) select({ ...sel, c1: at.c, r1: at.r });
      });
      addEventListener('mouseup', () => (dragging = false));
      canvas.tabIndex = 0;
      for (const item of menu.querySelectorAll('[role=menuitemcheckbox]')) {
        item.addEventListener('click', () => item.setAttribute('aria-checked', String(item.getAttribute('aria-checked') !== 'true')));
      }
      addEventListener('keydown', (e) => {
        if (e.key === 'Escape') menu.style.display = 'none';
      });
      // Typing on the grid goes into the cell editor; Tab and Enter commit it and move on.
      canvas.addEventListener('keydown', (e) => {
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
          editor.textContent = '';
          editor.focus();
        }
      });
      editor.addEventListener('keydown', (e) => {
        if (e.key !== 'Tab' && e.key !== 'Enter') return;
        e.preventDefault();
        values.set(`${col(sel.c0)}${sel.r0 + 1}`, editor.textContent);
        editor.textContent = '';
        const c = Math.min(COLS - 1, sel.c0 + (e.key === 'Tab' ? 1 : 0));
        const r = Math.min(ROWS - 1, sel.r0 + (e.key === 'Enter' ? 1 : 0));
        select({ c0: c, r0: r, c1: c, r1: r });
        canvas.focus();
        document.getElementById('last-action').textContent = [...values].map(([k, v]) => `${k}=${v}`).join(' ');
      });
      canvas.addEventListener('keydown', (e) => {
        const d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
        if (!d) return;
        e.preventDefault();
        const c = Math.max(0, Math.min(COLS - 1, sel.c0 + d[0]));
        const r = Math.max(0, Math.min(ROWS - 1, sel.r0 + d[1]));
        select({ c0: c, r0: r, c1: c, r1: r });
      });
      // A reference typed into the Name Box, then Enter, selects it (a named range is left as typed).
      box.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        // A reference may name another sheet, as in Sheets: 'Totals'!B3 (quotes doubled inside).
        let text = box.value.trim();
        const q = /^'((?:[^']|'')+)'!(.+)$/.exec(text);
        if (q) {
          const name = q[1].replace(/''/g, "'");
          const tab = [...document.querySelectorAll('.docs-sheet-tab')].find((t) => t.textContent.trim() === name);
          if (!tab) return;
          tab.click();
          text = q[2];
        }
        const m = /^([A-H])([1-9]\d?)(?::([A-H])([1-9]\d?))?$/i.exec(text);
        if (!m) return;
        const c0 = m[1].toUpperCase().charCodeAt(0) - 65;
        const r0 = Number(m[2]) - 1;
        const c1 = m[3] ? m[3].toUpperCase().charCodeAt(0) - 65 : c0;
        const r1 = m[4] ? Number(m[4]) - 1 : r0;
        select({ c0, r0, c1, r1 });
        canvas.focus();
      });
      for (const tab of document.querySelectorAll('.docs-sheet-tab')) {
        tab.addEventListener('click', () => {
          document.querySelector('.docs-sheet-active-tab')?.classList.remove('docs-sheet-active-tab');
          tab.classList.add('docs-sheet-active-tab');
          select({ c0: 0, r0: 0, c1: 0, r1: 0 });
        });
      }
      document.getElementById('sort-asc').addEventListener('click', () => (document.getElementById('last-action').textContent = `Sorted ${box.value}`));
      placeEditor();
      draw();
    </script>
  </body>
</html>
