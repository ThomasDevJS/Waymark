<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fleet</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      nav.side { display: flex; flex-direction: column; width: 180px; gap: 4px; }
      .nav-item { position: relative; }
      .flyout { display: none; position: absolute; left: 100%; top: 0; flex-direction: column; background: #fff; border: 1px solid #999; padding: 4px; width: 140px; }
      .flyout.is-open { display: flex; }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Fleet</h1>
      <button type="button" id="start">Start here</button>
      <!-- D204: a side nav whose item shows its flyout while the pointer rests on it, or while it has focus. -->
      <nav class="side" aria-label="Side">
        <div class="nav-item" id="reports-item">
          <button type="button" id="reports">Reports</button>
          <div class="flyout" id="reports-flyout">
            <a href="#fuel" id="fuel">Fuel</a>
            <a href="#idle" id="idle">Idle time</a>
          </div>
        </div>
        <button type="button" id="settings">Settings</button>
      </nav>
      <p id="picked">Nothing picked</p>
    </main>
    <script type="module">
      const item = document.getElementById('reports-item');
      const flyout = document.getElementById('reports-flyout');
      const open = () => flyout.classList.add('is-open');
      const close = () => flyout.classList.remove('is-open');
      item.addEventListener('mouseenter', open);
      item.addEventListener('mouseleave', () => {
        if (!item.contains(document.activeElement)) close();
      });
      item.addEventListener('focusin', open);
      item.addEventListener('focusout', (e) => {
        if (!item.contains(e.relatedTarget) && !item.matches(':hover')) close();
      });
      for (const a of flyout.querySelectorAll('a')) {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          document.getElementById('picked').textContent = `Picked ${a.textContent}`;
          close();
        });
      }
    </script>
  </body>
</html>
