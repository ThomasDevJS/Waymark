<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Nested frames app</title>
<style>body{margin:0;font:14px system-ui} nav{display:flex;gap:16px;padding:12px;background:#234} nav a{color:#fff} iframe{border:0;width:100%;height:900px;display:block}</style></head>
<body>
  <!-- Mirrors a dashboard whose top nav loads screens into a frame, with frames nested 3 deep (#32). -->
  <nav class="navbar" role="navigation"><ul style="display:flex;gap:16px;list-style:none;margin:0;padding:0">
    <li id="app_sub1"><a class="nav-link" href="#" data-screen="home.html">Home</a></li>
    <li id="app_sub7"><a class="nav-link border-left" href="#" data-screen="csa.html">Safety</a></li>
  </ul></nav>
  <iframe id="action_frame" src="home.html"></iframe>
  <script>
    // Like the real dashboard (#32 follow-up): a screen is shown in a brand-new frame element (a new
    // frameId), swapped in after the app has fetched it (?swap=<ms>), so the old frames live on briefly.
    const swapMs = Number(new URLSearchParams(location.search).get('swap') ?? 0);
    for (const a of document.querySelectorAll('[data-screen]')) a.addEventListener('click', (e) => {
      e.preventDefault();
      setTimeout(() => {
        const old = document.querySelectorAll('#action_frame')[0];
        const f = document.createElement('iframe');
        f.src = a.dataset.screen;
        // ?keep=<ms>: the new frame loads next to the old one, which is removed only that long after.
        const keepMs = new URLSearchParams(location.search).get('keep');
        if (keepMs === null) {
          f.id = 'action_frame';
          old.replaceWith(f);
          return;
        }
        // Same id as the old one, as apps do: both frames match the recorded frame path for a while.
        f.id = 'action_frame';
        f.style.position = 'absolute';
        f.style.top = '50px';
        old.after(f);
        f.addEventListener('load', () => setTimeout(() => { old.remove(); f.style.position = ''; }, Number(keepMs)), { once: true });
      }, swapMs);
    });
    document.documentElement.setAttribute('data-waymark-test-loaded', 'yes');
  </script>
</body>
</html>
